services:
  postgres:
    image: postgres:15-alpine
    container_name: searchy_pg
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
      POSTGRES_DB: ${DB_NAME:- searchy_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-searchy_db}']
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
    driver: local
